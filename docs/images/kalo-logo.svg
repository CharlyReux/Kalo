             M716 80 C687 80 664 98 664 120 C664 142 687 160 716 160 C745 160 768 142 768 120 C768 98 745 80 716 80 Z"/>
  </g>

  <text x="429" y="252" text-anchor="middle" fill="#8a949e" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="22" letter-spacing="9">HALO: REACH MODDING WORKBENCH</text>
</svg>
