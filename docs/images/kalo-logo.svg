      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#d9dfe5"/>
      <stop offset="0.48" stop-color="#8c97a2"/>
      <stop offset="0.52" stop-color="#c3cbd2"/>
      <stop offset="0.8" stop-color="#7c8792"/>
      <stop offset="1" stop-color="#4e5862"/>
    </linearGradient>
  </defs>

  <g fill="url(#steel)" stroke="#1b2128" stroke-width="3" stroke-linejoin="miter" fill-rule="evenodd">
